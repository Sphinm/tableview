<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050608" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TableView" />
    <!-- iOS does not support SVG apple-touch-icons; must be a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('tableview_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f8fafc');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Fonts are self-hosted (see src/index.css) to avoid third-party connections. -->
    
    <!-- Primary Meta Tags -->
    <title>TableView.dev — Browser Data Workspace for CSV, Excel, Parquet &amp; JSON</title>
    <meta name="title" content="TableView.dev — Browser Data Workspace for CSV, Excel, Parquet &amp; JSON" />
    <meta
      name="description"
      content="100% private in-browser data workspace. View, query with SQL, and convert CSV, Excel (.xlsx), Apache Parquet, and JSON files directly in your browser with zero server uploads."
    />
    <meta
      name="keywords"
      content="csv viewer, excel viewer online, parquet viewer, sql on csv, csv to excel, parquet to csv, convert parquet to excel, in-browser duckdb, open csv online, json viewer, browser data workspace, zero upload data tool"
    />
    <link rel="canonical" href="https://tableview.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tableview.dev/" />
    <meta property="og:title" content="TableView.dev — Browser Data Workspace for CSV, Excel, Parquet &amp; JSON" />
    <meta
      property="og:description"
      content="View, query with SQL, and convert CSV, Excel, Parquet, and JSON files directly in your browser. 100% local WebAssembly processing with zero server uploads."
    />
    <meta property="og:site_name" content="TableView.dev" />

    <!-- Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://tableview.dev/" />
    <meta property="twitter:title" content="TableView.dev — Browser Data Workspace for CSV, Excel, Parquet &amp; JSON" />
    <meta
      property="twitter:description"
      content="View, query with SQL, and convert CSV, Excel, Parquet, and JSON files directly in your browser. 100% local WebAssembly processing with zero server uploads."
    />

    <!--
      Google Consent Mode v2 — MUST execute before any Google/ads/analytics tag.
      Default is DENIED (GDPR/ePrivacy safe); src/lib/consent.ts upgrades this to
      granted only after explicit user consent, and gates Clarity behind it.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });

      // Restore a previously granted choice as early as possible.
      try {
        if (localStorage.getItem('tableview_cookie_consent') === 'accepted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {}
    </script>

    <!-- Google AdSense Script Tag -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3414270480046504"
      crossorigin="anonymous"></script>

    <!--
      Google Analytics 4 and Microsoft Clarity are loaded from src/lib/consent.ts
      ONLY after the user grants analytics consent (GDPR/ePrivacy). They are
      intentionally NOT loaded here: this is BASIC consent mode, so no request
      reaches googletagmanager.com or clarity.ms before an explicit opt-in.
      The gtag shim above exists purely so Consent Mode defaults are registered
      in the right order relative to the AdSense tag.
    -->

    <!-- Structured Data: WebApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TableView.dev",
        "url": "https://tableview.dev",
        "description": "Fast, private in-browser Apache Parquet inspector, SQL query workbench, and native Excel converter powered by DuckDB-Wasm.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires WebAssembly support. Works offline in Chrome, Safari, Firefox, and Edge.",
        "softwareVersion": "1.2.0",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
