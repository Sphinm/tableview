<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - TableView.dev</title>
  <script>
    // SPA redirect fallback: preserve the intended path so the router can
    // resolve aliases (/dscr, /1031, ...) after the reload.
    var pathname = window.location.pathname;
    if (pathname && pathname !== '/404.html' && pathname !== '/404') {
      sessionStorage.setItem('redirect_path', pathname + window.location.search + window.location.hash);
      window.location.replace('/');
    }
  </script>
  <meta http-equiv="refresh" content="3;url=/">
  <style>
    body {
      background: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .box {
      max-width: 420px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    p {
      color: #475569;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page Not Found</h1>
    <p>The underwriting tool or article you requested is not available. Redirecting you to the TableView underwriting hub...</p>
    <a href="/">Return to Underwriting Hub</a>
  </div>
</body>
</html>
