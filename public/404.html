<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — TableView.dev</title>
  <script>
    // SPA redirect fallback
    var pathname = window.location.pathname;
    if (pathname && pathname !== '/404.html' && pathname !== '/404') {
      sessionStorage.setItem('redirect_path', pathname + window.location.search + window.location.hash);
      window.location.replace('/');
    }
  </script>
  <meta http-equiv="refresh" content="3;url=/">
  <style>
    body {
      background: #050608;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 1rem;
    }
    .box {
      max-width: 420px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      background: #4f46e5;
      color: #ffffff;
      text-decoration: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved. Redirecting you to the TableView Workbench...</p>
    <a href="/">Return to Workbench</a>
  </div>
</body>
</html>
